<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全验证</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 360px; min-height: 360px; margin: 0; overflow: hidden; background: #f7f9fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; align-items: stretch; justify-content: center; }
    .captcha-page { width: 100%; height: 360px; }
    .message { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; margin: 0; padding: 18px; color: #6b7688; font-size: 14px; line-height: 1.6; text-align: center; }
    .message.error { color: #d03050; }
  </style>
</head>
<body>
  <div class="captcha-page"><p class="message">正在加载验证</p></div>
  <script>
    function showError(text) { document.querySelector('.captcha-page').innerHTML = '<p class="message error">' + text + '</p>'; }
    function getQueryParam(url, name) {
      var match = new RegExp('[?&]' + name + '=([^&#]*)', 'i').exec(url);
      return match ? decodeURIComponent(match[1].replace(/\+/g, '%20')) : '';
    }
    var sourceURL = getQueryParam(window.location.href, 'url');
    if (!sourceURL) { showError('缺少验证地址'); throw new Error('missing captcha url'); }
    var uin = getQueryParam(sourceURL, 'uin');
    var sid = getQueryParam(sourceURL, 'sid');
    var aid = getQueryParam(sourceURL, 'aid') || '2053843612';
    var loginAppID = getQueryParam(sourceURL, 'login_appid') || '16';
	var qq = getQueryParam(window.location.href, 'qq') || uin;
    if (!sid || !uin) { showError('验证参数无效'); throw new Error('missing captcha params'); }
    function postResult(result) {
      if (!result || !result.ticket) return;
      window.parent.postMessage({ type: 'login-slider-captcha', ticket: String(result.ticket || ''), randstr: String(result.randstr || '') }, window.location.origin);
    }
    function initCaptcha() {
      try {
        document.querySelector('.captcha-page').innerHTML = '';
        var captcha = new window.TencentCaptcha(aid, function(result) { postResult(result); }, { type: 'full', showHeader: false, login_appid: loginAppID, uin: uin, sid: sid, enableAged: true });
        captcha.show();
      } catch (error) { showError('验证初始化失败'); }
    }
    function loadScript(src, ok, fail) {
      var script = document.createElement('script'); script.onload = ok; script.onerror = fail; script.src = src; document.head.appendChild(script);
    }
    var proxyScript = qq ? '/api/qq/account/' + encodeURIComponent(qq) + '/security-slider/script.js?slider_url=' + encodeURIComponent(sourceURL) : '';
    loadScript(proxyScript || 'https://captcha.gtimg.com/TCaptcha.js', initCaptcha, function() {
      loadScript('https://ssl.captcha.qq.com/TCaptcha.js', initCaptcha, function() { showError('验证资源加载失败'); });
    });
  </script>
</body>
</html>
